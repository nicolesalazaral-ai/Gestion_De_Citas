{% extends "base.html" %}
{% block title %}Iniciar sesión · Clínica Salud{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:70vh">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex p-3 mb-3"><i class="bi bi-heart-pulse fs-2"></i></div>
        <h1 class="h3 fw-bold">Bienvenido</h1><p class="text-secondary mb-0">Ingresa al sistema de la clínica</p>
      </div>
      {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label><input class="form-control form-control-lg" id="{{ form.username.id_for_label }}" name="{{ form.username.html_name }}" required autofocus></div>
        <div class="mb-4"><label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label><input class="form-control form-control-lg" type="password" id="{{ form.password.id_for_label }}" name="{{ form.password.html_name }}" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
